<title>ЕГЭ Информатика — Задание 7. Кодирование и декодирование информации. Передача информации</title>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f5f5f7;
  --bg-card: #ffffff;
  --text: #1d1d1f;
  --text-soft: #515154;
  --text-muted: #86868b;
  --border: #d2d2d7;
  --border-soft: #e8e8ed;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: #e8f4fd;
  --success: #34c759;
  --success-soft: #eafaf1;
  --error: #ff3b30;
  --error-soft: #fff0ef;
  --warning: #ff9500;
  --warning-soft: #fff8eb;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 4px 12px rgba(0,0,0,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  color: var(--text);
  background: var(--bg-soft);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body { padding: 16px; }
.container { max-width: 1000px; margin: 0 auto; }
.header { background: var(--bg-card); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); }
.header-title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
.header-sub { color: var(--text-soft); font-size: 15px; }
.header-meta { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--text-muted); }
.header-meta span { display: flex; align-items: center; gap: 6px; }
.tabs { display: flex; gap: 8px; background: var(--bg-card); padding: 8px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); overflow-x: auto; }
.tab { flex: 1; min-width: 140px; padding: 12px 16px; border: none; background: transparent; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: var(--text-soft); cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap; }
.tab:hover { background: var(--bg-soft); color: var(--text); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab.active { background: var(--accent); color: white; box-shadow: var(--shadow-sm); }
.card { background: var(--bg-card); border-radius: var(--radius); padding: 26px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); }
.card-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 600; margin: 20px 0 10px; color: var(--text); }
p { margin-bottom: 12px; color: var(--text-soft); }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 10px 0 14px 24px; color: var(--text-soft); }
li { margin-bottom: 6px; }
strong { color: var(--text); font-weight: 600; }
.note { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 14px 18px; border-radius: 10px; margin: 16px 0; font-size: 14px; color: var(--text); }
.note-warn { background: var(--warning-soft); border-left-color: var(--warning); }
.note-success { background: var(--success-soft); border-left-color: var(--success); }
.note-info { background: #f0f9ff; border-left-color: #0ea5e9; }
.plate { display: block; width: fit-content; margin: 12px auto; padding: 12px 28px; text-align: center; background: var(--accent-soft); border: 1.5px dashed var(--accent); border-radius: 12px; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: var(--text); }
/* Формулы — отдельными блоками, как в оригинале */
.eq { display: block; width: fit-content; max-width: 100%; overflow-x: auto; font-family: "Consolas", "Monaco", monospace; font-size: 14px; font-weight: 600; color: var(--text); background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; margin: 8px 0 12px; white-space: pre-wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 20px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.15s; min-height: 44px; min-width: 44px; text-decoration: none; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-soft); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border-soft); }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.task { background: var(--bg-card); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; border: 1px solid var(--border-soft); box-shadow: var(--shadow-sm); }
.task-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.task-num { font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 20px; }
.task-text { color: var(--text); font-size: 15px; margin-bottom: 12px; line-height: 1.65; }
.input-group { margin-top: 14px; }
.input-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-soft); margin-bottom: 6px; }
.input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; background: var(--bg-card); color: var(--text); transition: border-color 0.15s, box-shadow 0.15s; min-height: 44px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.correct { border-color: var(--success); background: var(--success-soft); }
.input.wrong { border-color: var(--error); background: var(--error-soft); }
.feedback { margin-top: 10px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; display: none; }
.feedback.show { display: block; }
.feedback.success { background: var(--success-soft); color: #1b7a3d; border: 1px solid #b7ebc9; }
.feedback.error { background: var(--error-soft); color: #c41e14; border: 1px solid #f5c6c2; }
.solution { margin-top: 12px; padding: 16px 18px; background: var(--bg-soft); border-radius: var(--radius-sm); border-left: 3px solid var(--accent); font-size: 14px; line-height: 1.7; display: none; }
.solution.show { display: block; }
.solution-title { font-weight: 600; margin-bottom: 8px; color: var(--text); }
.solution p { margin-bottom: 10px; }
.solution p:last-child { margin-bottom: 0; }
.solution .eq { background: var(--bg-card); }
.solution-link { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--text-muted); text-decoration: none; }
.solution-link:hover { color: var(--accent); text-decoration: underline; }
.results-panel { background: var(--bg-card); border-radius: var(--radius); padding: 24px; margin-top: 20px; border: 1px solid var(--border-soft); box-shadow: var(--shadow); display: none; }
.results-panel.show { display: block; }
.results-score { text-align: center; padding: 22px; background: var(--accent-soft); border-radius: var(--radius-sm); margin-bottom: 16px; }
.results-score-num { font-size: 52px; font-weight: 700; color: var(--accent); line-height: 1; }
.results-score-label { font-size: 14px; color: var(--text-soft); margin-top: 6px; }
.progress-bar { height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.result-item { padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 8px; border: 1px solid var(--border); font-size: 14px; }
.result-item.correct { background: var(--success-soft); border-color: #b7ebc9; }
.result-item.wrong { background: var(--error-soft); border-color: #f5c6c2; }
.result-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
.result-item-num { font-weight: 600; color: var(--text); }
.result-item-status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
.result-item-status.correct { background: var(--success); color: white; }
.result-item-status.wrong { background: var(--error); color: white; }
.result-item-answers { font-size: 13px; color: var(--text-soft); }
.result-item-answers strong { color: var(--text); }
.result-item-solution { margin-top: 10px; font-size: 13px; color: var(--text-soft); line-height: 1.7; }
.result-item-solution p { margin-bottom: 8px; }
.result-item-solution .eq { font-size: 12px; }
.footer { text-align: center; padding: 20px; font-size: 13px; color: var(--text-muted); margin-top: 20px; }
.footer a { color: var(--accent); text-decoration: none; }
.footer a:hover { text-decoration: underline; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.section-desc { font-size: 14px; color: var(--text-muted); }
@media (max-width: 640px) {
  .header-title { font-size: 24px; }
  .plate { font-size: 13px; padding: 10px 18px; }
  .eq { font-size: 12px; }
}
</style>

<script>
/* ========== ДАННЫЕ: условия и решения дословно из оригинала (вариант №21296643) ==========
   Все степени записаны Unicode-символами (², ³, ¹⁰, ⁱ и т.д.) — LaTeX и MathJax не требуются,
   страница корректно отображается офлайн и при любом интернете. */
const THEORY_TASKS = [
  {
    num: 64937, type: 1,
    text: 'Запись о документе в информационной системе содержит его текст и отсканированную копию, полученную сканированием с разрешением 200 dpi и сжатием полученного изображения на 40%. При этом текст документа занимает 50% всего объёма записи.\n\nСколько процентов объёма записи будет занимать текст документа, если заменить отсканированную копию на новую, сделанную с разрешением 300 dpi и сжатием изображения на 60%?\n\nВ ответе запишите только число (количество процентов), без знака %.',
    solution: 'Документ содержит текст и отсканированную копию. Посчитаем объем отсканированной копии:\n\nEQ:200·x·200·y·0,6,\n\nгде x и y — количество дюймов по горизонтали и по вертикали соответственно. Поскольку изображение сжали на 40%, умножаем на 0,6.\n\nПоскольку текст документа занимает 50% всего объёма записи, то размер текста тоже равен:\n\nEQ:200·x·200·y·0,6.\n\nПосчитаем объем нового изображения:\n\nEQ:300·x·300·y·0,4.\n\nПоскольку размер текста не изменился, то объем нового документа равен:\n\nEQ:300·x·300·y·0,4 + 200·x·200·y·0,6.\n\nНайдём отношение объёма текста к объёму нового документа:\n\nEQ:(200·x·200·y·0,6) / (300·x·300·y·0,4 + 200·x·200·y·0,6) = 0,4.\n\n40 процентов объёма записи будет занимать текст документа, если заменить отсканированную копию на новую.',
    answer: '40'
  },
  {
    num: 13355, type: 2,
    text: 'Музыкальный фрагмент был оцифрован и записан в виде файла без использования сжатия данных. Получившийся файл был передан в город А по каналу связи за 15 секунд. Затем тот же музыкальный фрагмент был оцифрован повторно с разрешением в 2 раза выше и частотой дискретизации в 1,5 раза меньше, чем в первый раз. Сжатие данных не производилось. Полученный файл был передан в город Б; пропускная способность канала связи с городом Б в 2 раза выше, чем канала связи с городом А. Сколько секунд длилась передача файла в город Б? В ответе запишите только целое число, единицу измерения писать не нужно.',
    solution: 'Объём файла прямо пропорционален разрешению файла и его частоте дискретизации. Следовательно, объём файла во втором случае в 2/1,5 = 4/3 раза больше. Длительность передачи обратно пропорциональна пропускной способности канала связи, откуда получаем, что длительность передачи файла во второй раз равна:\n\nEQ:15·(1/2)·(4/3) = 10.',
    answer: '10'
  },
  {
    num: 27538, type: 3,
    text: 'Для проведения эксперимента записывается звуковой фрагмент в формате квадро (четырёхканальная запись) с частотой дискретизации 32 кГц и 32-битным разрешением. Результаты записываются в файл, сжатие данных не производится; дополнительно в файл записывается служебная информация, необходимая для эксперимента, размер полученного файла 97 Мбайт. Затем производится повторная запись этого же фрагмента в формате моно (одноканальная запись) с частотой дискретизации 16 кГц и 16-битным разрешением. Результаты тоже записываются в файл без сжатия и со служебной информацией, размер полученного файла 7 Мбайт. Объём служебной информации в обоих случаях одинаков. Укажите этот объём в мегабайтах. В ответе укажите только число (количество Мбайт), единицу измерения указывать не надо.',
    solution: 'Получаем систему:\n\nEQ:97·2²⁰ (байт) = 4 (количество каналов)·32000 (частота)·4 (разрешение в байтах)·T (время в секундах) + X (объём служебной информации);\n\nEQ:7·2²⁰ (байт) = 1 (количество каналов)·16000 (частота)·2 (разрешение в байтах)·T (время в секундах) + X (объём служебной информации).\n\nПреобразовав систему, получаем:\n\nEQ:X = 2¹⁶·15·16 : 15 = 2²⁰ байт = 1 Мбайт.\n\nПриведём другое решение.\n\nПусть размер звукового фрагмента при повторной записи равен Y. При первой записи количество каналов больше в 4 раза, частота дискретизации больше в 2 раза и разрешение больше в 2 раза, поэтому размер файла будет больше в 4·2·2 = 16 раз и составит 16Y.\n\nПусть объем служебной информации равен Х. Тогда получим систему уравнений:\n\nEQ:X + 16Y = 97 (для первой записи);\n\nEQ:X + Y = 7 (для второй записи),\n\nоткуда Х = 1.',
    answer: '1'
  },
  {
    num: 15919, type: 4,
    text: 'Автоматическая фотокамера производит растровые изображения размером 1600 на 1200 пикселей. При этом объём файла с изображением не может превышать 1 Мбайт, упаковка данных не производится. Какое максимальное количество цветов можно использовать в палитре?',
    solution: 'Объём растрового изображения находится как произведение количества пикселей в изображении на объём памяти x, необходимый для хранения цвета одного пикселя:\n\nEQ:1600·1200·x ≤ 1·2²³ бит,\n\nоткуда x ≤ 4,369 бит = 4 бит. Значит, в изображении можно использовать не более 2⁴ = 16 цветов.',
    answer: '16'
  }
];

const TASKS = [
  {
    id: 1, num: 47211,
    text: 'Музыкальный фрагмент был записан в формате моно, оцифрован и сохранён в виде файла без использования сжатия данных. Размер полученного файла — 28 Мбайт. Затем тот же музыкальный фрагмент был записан повторно в формате стерео (двухканальная запись) и оцифрован с разрешением в 3,5 раза выше и частотой дискретизации в 2 раза меньше, чем в первый раз. Сжатие данных не производилось. Укажите размер полученного при повторной записи файла в Мбайт. В ответе запишите только целое число, единицу измерения писать не нужно.',
    solution: 'Найдём размер файла, получившегося при повторной записи:\n\nEQ:28·2·3,5/2 = 98.',
    answer: '98'
  },
  {
    id: 2, num: 76110,
    text: 'В информационной системе хранятся изображения размером 512 × 280 пк. При кодировании используется алгоритм сжатия изображений, позволяющий уменьшить размер памяти для хранения одного изображения в среднем на 25% по сравнению с независимым кодированием каждого пикселя. Каждое сжатое изображение дополняется служебной информацией, которая занимает 32 Кбайт. Для хранения 64 изображений потребовалось 16 Мбайт. Сколько цветов использовано в палитре каждого изображения?',
    solution: 'Находим: N = 2ⁱ, w·h = 512·280, V1 = w·h·i·0,75 — объем одного изображения, сжатого на 25%. Имеем: n = 64, Vд = 32 Кбайт = 262144 бит: Vд — объём доп. информации.\n\nСоставим уравнение для общего объёма:\n\nEQ:n·(V1 + Vд) = 16 Мбайт = 134217728 бит.\n\nТогда\n\nEQ:V1 = 134217728/n − Vд = 1835008 бит.\n\nОтсюда\n\nEQ:i = V1/(0,75·w·h) = 1835008/(512·280·0,75) ≈ 17 бит.\n\nИтак, N = 2ⁱ = 2¹⁷ = 131072 цветов.',
    answer: '131072'
  },
  {
    id: 3, num: 61353,
    text: 'Аудиопоток кодируется в режиме стерео (2 канала) с частотой дискретизации 48 кГц и передаётся по каналу с пропускной способностью 45 Кбайт/сек. При этом используются методы сжатия, которые позволяют сократить объём передаваемой информации на 84%. С какой максимальной глубиной кодирования можно вести запись?\n\nВ ответе укажите только целое число — максимально возможную глубину кодирования в битах.',
    solution: 'Скорость передачи аудиопотока можно найти, разделив объем передаваемого файла на время передачи. Возьмём время передачи за 1 секунду, а глубину кодирования возьмём за x, также учтём, что изначальный объем сократили на 84%:\n\nEQ:2 (стереозапись)·48000·x·(1 − 0,84) = 45·1024·8 бит/сек.\n\nВычисляем выражение и получаем максимальной глубиной кодирования — 24 бита.',
    answer: '24'
  },
  {

/* Рендер решений: обычные абзацы + формулы EQ: отдельными блоками, как в оригинале */
function renderSolutionBlocks(container, solutionText) {
  solutionText.split('\n\n').forEach(part => {
    const trimmed = part.trim();
    if (!trimmed) return;
    if (trimmed.startsWith('EQ:')) {
      const eq = document.createElement('div');
      eq.className = 'eq';
      eq.textContent = trimmed.slice(3);
      container.appendChild(eq);
    } else {
      const p = document.createElement('p');
      p.innerHTML = trimmed.replace(/\n/g, '<br>');
      container.appendChild(p);
    }
  });
}

function renderConditionBlocks(container, text) {
  text.split('\n\n').forEach(part => {
    const trimmed = part.trim();
    if (!trimmed) return;
    const p = document.createElement('p');
    p.className = 'task-text';
    p.innerHTML = trimmed.replace(/\n/g, '<br>');
    container.appendChild(p);
  });
}

    <div class="plate">ПЕРЕДАЧА: t = V/U</div>
    <div class="note">
      <strong>Единицы:</strong> 1 байт = 8 бит; 1 Кбайт = 2¹⁰ байт; 1 Мбайт = 2²⁰ байт. Сжатие «на p%» означает, что остаётся (100 − p)% объёма. При изменении dpi количество пикселей меняется пропорционально <strong>квадрату</strong> отношения разрешений.
    </div>
  `;
  app.appendChild(intro);

  const typeInfo = {
    1: {
      title: 'Тип 1. Хранение текстовых документов',
      method: 'Запись о документе состоит из текста и отсканированной копии. Известно, какую долю занимает текст, и как меняются параметры сканирования (dpi и процент сжатия). Метод: обозначьте размер копии до сжатия через произведение разрешения и сторон (x, y), выразите все части записи и найдите отношение.',
      plates: ['РАЗМЕР КОПИИ = РАЗРЕШЕНИЕ² · x · y · (100 − p)%']
    },
    2: {
      title: 'Тип 2. Передача звуковых файлов',
      method: 'Файл передаётся по каналу связи: время передачи t = V/U. При повторной оцифровке меняются разрешение и частота, а канал может быть другим. Метод: выразите новый объём через старый с помощью коэффициентов и учтите изменение пропускной способности.',
      plates: ['t = V/U', 'V₂ = V₁ · (разрешение₂/разрешение₁) · (f₂/f₁)']
    },
    3: {
      title: 'Тип 3. Хранение звуковых файлов',
      method: 'Объём несжатой звукозаписи: V = f·t·i·n. Если есть служебная информация X — составляйте систему уравнений «X + звук = размер файла» для двух записей и вычитайте её.',
      plates: ['V = f·t·i·n', 'ФАЙЛ = ЗВУК + СЛУЖЕБНАЯ ИНФОРМАЦИЯ']
    },
    4: {
      title: 'Тип 4. Хранение и передача изображений',
      method: 'Объём растрового изображения: V = K·i, где K — количество пикселей, i — глубина цвета (бит на пиксель). Число цветов палитры: N = 2ⁱ. Памяти выделено «не более» — глубину цвета округляем вниз до целого.',
      plates: ['V = K·i', 'N = 2ⁱ', 'i = V/K (округляем вниз)']
    }
  };

  THEORY_TASKS.forEach((task, idx) => {
    const info = typeInfo[task.type];
    const card = document.createElement('section');
    card.className = 'card';
    card.innerHTML = `
      <h2 class="card-title">${info.title}</h2>
      ${info.plates.map(p => `<div class="plate">${p}</div>`).join('')}
      <p>${info.method}</p>
      <h3>Разбор примера (задание №${task.num})</h3>
      <div class="cond-${idx}"></div>
      <h3>Решение</h3>
      <div class="sol-${idx}"></div>
      <div class="note note-success"><strong>Ответ: ${task.answer}</strong></div>
    `;
    app.appendChild(card);
    renderConditionBlocks(card.querySelector('.cond-' + idx), task.text);
    renderSolutionBlocks(card.querySelector('.sol-' + idx), task.solution);
  });

  const mistakes = document.createElement('section');
  mistakes.className = 'card';
  mistakes.innerHTML = `
    <h2 class="card-title">Типичные ошибки</h2>
    <ul>
      <li>❌ Путать биты и байты: глубина кодирования обычно в битах, а пропускная способность канала — в байтах или битах в секунду</li>
      <li>❌ Забывать, что при смене dpi пикселей становится больше в <strong>квадрат</strong> отношения разрешений</li>
      <li>❌ Считать «сжатие на 84%» как умножение на 0,84 вместо 0,16 (остаётся 100 − 84 = 16%)</li>
      <li>❌ Забывать число каналов: моно = 1, стерео = 2, квадро = 4</li>
      <li>❌ Не вычитать служебную информацию перед вычислением глубины цвета</li>
      <li>❌ Округлять глубину цвета вверх вместо вниз (памяти выделено «не более»)</li>
    </ul>
    <div class="note">
      <strong>Совет:</strong> в задачах со сравнением двух записей почти никогда не нужны абсолютные величины — работайте с отношениями (×2, ÷1,5 и т.п.), это быстрее и надёжнее.
    </div>
  `;
  app.appendChild(mistakes);
}

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';
  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.textContent = 'Задание ' + num + ' №' + task.num;
  header.appendChild(numEl);
  taskEl.appendChild(header);

  renderConditionBlocks(taskEl, task.text);

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';
  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ:';
  inputGroup.appendChild(label);
  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('data-lpignore', 'true');
  input.placeholder = 'Введите число';
  input.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    updateAnswer(mode, task.id, e.target.value);
  });
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);
    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }
  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);
  renderSolutionBlocks(solution, task.solution);
  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  solution.appendChild(makeOriginalLink(task.num));
  taskEl.appendChild(solution);

  return taskEl;
}

function renderPractice1() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">⚡ Практика 1</h2>
      <p class="section-desc">10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice1-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(0, 10).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice1'));
  });
}

function renderPractice2() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">📝 Практика 2</h2>
      <p class="section-desc">10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice2-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(10, 20).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice2'));
  });
  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary btn-block';
  checkBtn.textContent = '✓ Проверить все ответы';
  checkBtn.style.marginTop = '8px';
  checkBtn.addEventListener('click', checkAllPractice2);
  app.appendChild(checkBtn);
  const resultsPanel = document.createElement('div');
  resultsPanel.className = 'results-panel';
  resultsPanel.id = 'results-panel-2';
  app.appendChild(resultsPanel);
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;
  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;
  const userAnswer = (state.answers1[taskId] || '').trim();
  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }
  if (userAnswer === task.answer) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) sol.classList.toggle('show', state.showSolution1[taskId]);
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;
  TASKS.slice(10, 20).forEach((task, idx) => {
    const userAnswer = (state.answers2[task.id] || '').trim();
    const isCorrect = userAnswer === task.answer;
    if (isCorrect) correct++;
    results.push({ num: idx + 1, task, userAnswer: userAnswer || '—', isCorrect });
  });
  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;
  panel.innerHTML = '';
  panel.classList.add('show');
  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);
  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');
    const head = document.createElement('div');
    head.className = 'result-item-head';
    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);
    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);
    item.appendChild(head);
    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.task.answer);
    item.appendChild(answers);
    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.className = 'result-item-solution';
      renderSolutionBlocks(sol, r.task.solution);
      const solAnswer = document.createElement('p');
      solAnswer.style.marginTop = '8px';
      solAnswer.style.fontWeight = '600';
      solAnswer.style.color = 'var(--text)';
      solAnswer.textContent = 'Ответ: ' + r.task.answer;
      sol.appendChild(solAnswer);
      sol.appendChild(makeOriginalLink(r.task.num));
      item.appendChild(sol);
    }
    panel.appendChild(item);
  });
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;
  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });
  renderTheory();
}

init();
</script>
</body>
</html>

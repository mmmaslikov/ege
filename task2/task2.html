function highlightCode(code, lang) {
  const esc = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const pyKw = new Set(['if','elif','else','while','for','in','and','or','not','def','return','break','continue','import','from','as','True','False','None','lambda','global']);
  const pyFn = new Set(['print','input','int','str','float','range','len','abs','max','min','sum']);
  const algKw = new Set(['алг','нач','кон','цел','если','то','иначе','все','нц','кц','раз','использовать','и','или','не','div','mod']);
  const algFn = new Set(['ввод','вывод']);
  const re = /(#[^\n]*|\/\/[^\n]*)|("(?:[^"\n]|\\")*"|'(?:[^'\n]|\\')*')|(\d+(?:\.\d+)?)|([A-Za-z_А-Яа-яЁё][A-Za-z_0-9А-Яа-яЁё]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(esc)) !== null) {
    out += esc.slice(last, m.index);
    if (m[1]) out += '<span class="tok-com">' + m[1] + '</span>';
    else if (m[2]) out += '<span class="tok-str">' + m[2] + '</span>';
    else if (m[3]) out += '<span class="tok-num">' + m[3] + '</span>';
    else if (m[4]) {
      const w = m[4];
      if (lang === 'alg') {
        if (algKw.has(w)) out += '<span class="tok-kw">' + w + '</span>';
        else if (algFn.has(w)) out += '<span class="tok-fn">' + w + '</span>';
        else out += w;
      } else {
        if (pyKw.has(w)) out += '<span class="tok-kw">' + w + '</span>';
        else if (pyFn.has(w)) out += '<span class="tok-fn">' + w + '</span>';
        else out += w;
      }
    }
    last = m.index + m[0].length;
  }
  return out + esc.slice(last);
}

function makeCodeWindow(code, lang, filename) {
  const wrap = document.createElement('div');
  wrap.className = 'code-window';
  const head = document.createElement('div');
  head.className = 'code-window-header';
  head.innerHTML = '<span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="code-filename"></span>';
  head.querySelector('.code-filename').textContent = filename;
  const pre = document.createElement('pre');
  pre.className = 'code-window-body';
  pre.innerHTML = highlightCode(code, lang);
  wrap.appendChild(head);
  wrap.appendChild(pre);
  return wrap;
}

/* Теорию не переписываем: берём готовые .code-block вместе с их ручной
   подсветкой (спаны) и просто переносим внутрь нового окна */
function upgradeStaticCodeBlocks(root) {
  (root || document).querySelectorAll('.code-block').forEach(old => {
    const win = document.createElement('div');
    win.className = 'code-window';
    const head = document.createElement('div');
    head.className = 'code-window-header';
    head.innerHTML = '<span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="code-filename">program.py</span>';
    const pre = document.createElement('pre');
    pre.className = 'code-window-body';
    pre.innerHTML = old.innerHTML;
    win.appendChild(head);
    win.appendChild(pre);
    old.replaceWith(win);
  });
}

    <p>Мы получили 16 наборов. Рассмотрим вторую строку таблицы, в ней значение первой функции равно 0, а значение второй — 1, при этом три переменные принимают значение 0. Это возможно только в одном случае (0, 1, 0, 0), то есть y соответствует третий столбец.</p>

function isCodeLine(line) {
  const trimmed = line.trim();
  if (!trimmed) return false;
  
  const codePatterns = [
    /^print\(/,
    /^def\s+/,
    /^for\s+/,
    /^if\s+/,
    /^else\s*:/,
    /^return\s+/,
    /^\s{4}/,
    /^\s{8}/,
    /^\s{12}/,
    /^from\s+/,
    /^import\s+/,
    /^while\s+/,
    /^class\s+/,
    /^try\s*:/,
    /^except\s+/,
    /^with\s+/,
    /^yield\s+/,
    /^raise\s+/,
    /^lambda\s+/,
    /^assert\s+/,
    /^del\s+/,
    /^pass\s*$/,
    /^break\s*$/,
    /^continue\s*$/,
    /^global\s+/,
    /^nonlocal\s+/,
    /^@\w+/,
    /^\\\s*$/
  ];
  
  return codePatterns.some(pattern => pattern.test(trimmed));
}

function isSetLine(line) {
  const trimmed = line.trim();
  return /^\(\d+(,\s*\d+)*\)$/.test(trimmed);
}

function parseSolution(solutionText) {
  const paragraphs = solutionText.split('\n\n');
  const result = [];
  let inCodeBlock = false;
  let codeBuffer = [];
  let inSetList = false;
  let setBuffer = [];
  
  const flushCode = () => {
    if (codeBuffer.length > 0) {
      result.push({ type: 'code', content: codeBuffer.join('\n') });
      codeBuffer = [];
      inCodeBlock = false;
    }
  };
  
  const flushSets = () => {
    if (setBuffer.length > 0) {
      result.push({ type: 'sets', content: setBuffer });
      setBuffer = [];
      inSetList = false;
    }
  };
  
  for (const para of paragraphs) {
    const trimmed = para.trim();
    if (!trimmed) continue;
    
    const lines = trimmed.split('\n');
    let hasCode = false;
    let hasSets = false;
    
    for (const line of lines) {
      if (isCodeLine(line)) {
        hasCode = true;
        break;
      }
      if (isSetLine(line)) {
        hasSets = true;
        break;
      }
    }
    
    if (hasCode) {
      flushSets();
      inCodeBlock = true;
      codeBuffer.push(trimmed);
    } else if (hasSets) {
      flushCode();
      inSetList = true;
      for (const line of lines) {
        const l = line.trim();
        if (isSetLine(l)) {
          setBuffer.push(l);
        } else if (l) {
          flushSets();
          result.push({ type: 'text', content: l });
        }
      }
    } else {
      flushCode();
      flushSets();
      result.push({ type: 'text', content: trimmed });
    }
  }
  
  flushCode();
  flushSets();
  
  return result;
}

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';

  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.innerHTML = 'Задание ' + num + ' №' + task.num;
  header.appendChild(numEl);

  const linkEl = document.createElement('a');
  linkEl.className = 'task-link';
  linkEl.href = 'https://inf-ege.sdamgia.ru/problem?id=' + task.num;
  linkEl.target = '_blank';
  linkEl.rel = 'noopener';
  linkEl.textContent = 'Оригинал ↗';
  header.appendChild(linkEl);

  taskEl.appendChild(header);

  const textEl = document.createElement('p');
  textEl.className = 'task-text';
  textEl.innerHTML = task.text.replace(/\n/g, '<br>');
  taskEl.appendChild(textEl);

  if (task.text2) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.textContent = task.text2;
    taskEl.appendChild(t);
  }

  if (task.table) {
    const table = document.createElement('table');
    table.className = 'truth-table';
    task.table.forEach((row, i) => {
      const tr = document.createElement('tr');
      row.forEach((cell, j) => {
        const td = document.createElement(i === 0 ? 'th' : 'td');
        if (cell === '???') {
          td.className = 'empty-cell';
          td.textContent = '???';
        } else if (cell === '') {
          td.className = 'empty-cell';
          td.textContent = '';
        } else {
          td.className = 'marked';
          td.textContent = cell;
        }
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    taskEl.appendChild(table);
  }

  if (task.text3) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.textContent = task.text3;
    taskEl.appendChild(t);
  }

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';

  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ (буквы подряд, без пробелов):';
  inputGroup.appendChild(label);

  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('data-lpignore', 'true');
  input.placeholder = 'Например: yxwz';
  input.addEventListener('input', (e) => {
    e.target.value = e.target.value.toLowerCase().replace(/[^a-z]/g, '');
    updateAnswer(mode, task.id, e.target.value);
  });
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);

    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }

  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);

  const parsed = parseSolution(task.solution);
  parsed.forEach(item => {
    if (item.type === 'code') {
      solution.appendChild(makeCodeWindow(item.content, 'py', 'reshenie.py'));
    } else if (item.type === 'sets') {
      const setList = document.createElement('div');
      setList.className = 'set-list';
      item.content.forEach(set => {
        const setItem = document.createElement('div');
        setItem.className = 'set-list-item';
        setItem.textContent = set;
        setList.appendChild(setItem);
      });
      solution.appendChild(setList);
    } else {
      const p = document.createElement('p');
      p.textContent = item.content;
      solution.appendChild(p);
    }
  });

  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  taskEl.appendChild(solution);

  return taskEl;
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.checked1[taskId] = false;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;

  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;

  const userAnswer = (state.answers1[taskId] || '').trim().toLowerCase();

  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }

  state.checked1[taskId] = true;

  if (userAnswer === task.answer.toLowerCase()) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) {
    sol.classList.toggle('show', state.showSolution1[taskId]);
  }
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;

  TASKS.slice(12, 22).forEach((task, idx) => {
    const num = idx + 1;
    const userAnswer = (state.answers2[task.id] || '').trim().toLowerCase();
    const isCorrect = userAnswer === task.answer.toLowerCase();
    if (isCorrect) correct++;
    results.push({
      num: num,
      task: task,
      userAnswer: userAnswer || '—',
      correctAnswer: task.answer,
      isCorrect: isCorrect
    });
  });

  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;

  panel.innerHTML = '';
  panel.classList.add('show');

  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);

  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);

  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');

    const head = document.createElement('div');
    head.className = 'result-item-head';

    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);

    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);

    item.appendChild(head);

    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.correctAnswer);
    item.appendChild(answers);

    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.style.cssText = 'margin-top:10px;font-size:13px;color:var(--text-soft);line-height:1.6;';
      const parsed = parseSolution(r.task.solution);
      parsed.forEach(item2 => {
        if (item2.type === 'code') {
          const win = makeCodeWindow(item2.content, 'py', 'reshenie.py');
          win.querySelector('.code-window-body').style.fontSize = '12px';
          sol.appendChild(win);
        } else if (item2.type === 'sets') {
          const setList = document.createElement('div');
          setList.className = 'set-list';
          setList.style.fontSize = '12px';
          item2.content.forEach(set => {
            const setItem = document.createElement('div');
            setItem.className = 'set-list-item';
            setItem.textContent = set;
            setList.appendChild(setItem);
          });
          sol.appendChild(setList);
        } else {
          const p = document.createElement('p');
          p.textContent = item2.content;
          p.style.marginBottom = '6px';
          sol.appendChild(p);
        }
      });
      item.appendChild(sol);
    }

    panel.appendChild(item);
  });

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;

  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  renderTheory();
}

init();

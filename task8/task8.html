<style>

/* Код-окно */

.code-window-body::-webkit-scrollbar{height:9px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;min-height:44px;min-width:44px}

.result-item.wrong{background:var(--error-soft);border-color:#f5c6c2}
.result-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px}

.result-item-status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px}

@media(max-width:640px){
  body{padding:10px}
  .header{padding:20px}

<div class="container">

    <div class="header-meta">

  </footer>
</div>

<script>
/* ================= helpers данных ================= */
const P   = v => ({t:'p', v});
const OL  = v => ({t:'ol', v});
const UL  = v => ({t:'ul', v});
const SUB = v => ({t:'sub', v});
const EQ  = v => ({t:'eq', v});
const NOTE= (v,k) => ({t:'note', v, k:k||''});
const PY  = (file,v) => ({t:'code', lang:'py', file, v});
const PAS = v => ({t:'code', lang:'pas', file:'reshenie.pas', v});
const TH  = '🧠 Теоретическое решение';
const PR  = '💻 Программное решение';

/* ================= подсветка и код-окна ================= */
const PY_KW = new Set(['if','elif','else','while','for','in','and','or','not','def','return','break','continue','import','from','as','True','False','None','lambda','global','with','yield','pass','del','try','except','class','is']);
const PY_FN = new Set(['print','input','int','str','float','range','len','abs','max','min','sum','sorted','set','list','dict','tuple','enumerate','filter','map','all','any','product','permutations','combinations','lru_cache','cache','perm','comb','index','count','join','append','rjust','replace','functools','itertools','math']);
const PAS_KW = new Set(['begin','end','var','for','to','downto','do','if','then','else','function','procedure','while','repeat','until','and','or','not','mod','div','in','of','array','integer','double','string','boolean','halt','exit','const','type','case']);
const PAS_FN = new Set(['print','println','where','count','countof','cartesian','cartesianpower','numerate','sorted','order','first','last','sum','select','toarray','findindex','foreach','remove','joinToString','contains','ismatch','permutations','item1','item2','cache','dec','tobase','digits','minmax','windowed']);

function highlightCode(code, lang){
  const esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const re = lang === 'pas'
    ? /(\/\/[^\n]*|\{[^}]*\})|("(?:[^"\n]|"")*"|'(?:[^'\n]|'')*')|(\d+(?:\.\d+)?)|([A-Za-z_А-Яа-яЁё][A-Za-z_0-9А-Яа-яЁё]*)/g
    : /(#[^\n]*)|("(?:[^"\n]|\\")*"|'(?:[^'\n]|\\')*')|(\d+(?:\.\d+)?)|([A-Za-z_А-Яа-яЁё][A-Za-z_0-9А-Яа-яЁё]*)/g;
  const kw = lang === 'pas' ? PAS_KW : PY_KW;
  const fn = lang === 'pas' ? PAS_FN : PY_FN;
  let out = '', last = 0, m;
  while((m = re.exec(esc)) !== null){
    out += esc.slice(last, m.index);
    if(m[1]) out += '<span class="tok-com">'+m[1]+'</span>';
    else if(m[2]) out += '<span class="tok-str">'+m[2]+'</span>';
    else if(m[3]) out += '<span class="tok-num">'+m[3]+'</span>';
    else if(m[4]){
      const w = m[4], key = lang === 'pas' ? w.toLowerCase() : w;
      if(kw.has(key)) out += '<span class="tok-kw">'+w+'</span>';
      else if(fn.has(key)) out += '<span class="tok-fn">'+w+'</span>';
      else out += w;
    }
    last = m.index + m[0].length;
  }
  return out + esc.slice(last);
}

function makeCodeWindow(code, lang, filename){
  const wrap = document.createElement('div');
  wrap.className = 'code-window';
  const head = document.createElement('div');
  head.className = 'code-window-header';
  head.innerHTML = '<span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="code-filename"></span><span class="code-lang"></span>';
  head.querySelector('.code-filename').textContent = filename;
  head.querySelector('.code-lang').textContent = lang === 'pas' ? 'PascalABC.NET' : 'Python';
  const pre = document.createElement('pre');
  pre.className = 'code-window-body';
  pre.innerHTML = highlightCode(code, lang);
  wrap.appendChild(head); wrap.appendChild(pre);
  return wrap;
}

function renderBlocks(container, blocks){
  blocks.forEach(b => {
    if(b.t === 'p'){
      const p = document.createElement('p');
      p.innerHTML = b.v.replace(/\n/g,'<br>');
      container.appendChild(p);
    } else if(b.t === 'ol' || b.t === 'ul'){
      const list = document.createElement(b.t);
      b.v.forEach(item => { const li = document.createElement('li'); li.innerHTML = item; list.appendChild(li); });
      container.appendChild(list);
    } else if(b.t === 'sub'){
      const d = document.createElement('div'); d.className = 'sol-sub'; d.textContent = b.v; container.appendChild(d);
    } else if(b.t === 'eq'){
      const d = document.createElement('div'); d.className = 'eq'; d.textContent = b.v; container.appendChild(d);
    } else if(b.t === 'note'){
      const d = document.createElement('div'); d.className = 'note' + (b.k ? ' note-'+b.k : ''); d.innerHTML = b.v; container.appendChild(d);
    } else if(b.t === 'code'){
      container.appendChild(makeCodeWindow(b.v, b.lang, b.file));
    } else if(b.t === 'table'){
      const wrap = document.createElement('div'); wrap.style.overflowX = 'auto';
      const t = document.createElement('table'); t.className = 'mini-table';
      const hr = document.createElement('tr');
      b.head.forEach(h => { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
      t.appendChild(hr);
      b.rows.forEach(r => { const tr = document.createElement('tr'); r.forEach(c => { const td = document.createElement('td'); td.innerHTML = c; tr.appendChild(td); }); t.appendChild(tr); });
      wrap.appendChild(t); container.appendChild(wrap);
    }
  });
}

function makeOriginalLink(num){
  const a = document.createElement('a');
  a.className = 'solution-link'; a.target = '_blank'; a.rel = 'noopener';
  a.href = 'https://inf-ege.sdamgia.ru/problem?id=' + num;
  a.textContent = 'Оригинал задания ↗';
  return a;
}
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const $ = s => document.querySelector(s);

/* ================= ТЕОРИЯ: три разобранных задания ================= */
const THEORY_TASKS = [
{
  num:14269,
  condition:[P('Олег составляет таблицу кодовых слов для передачи сообщений, каждому сообщению соответствует своё кодовое слово. В качестве кодовых слов Олег использует 4-буквенные слова, в которых есть только буквы A, B, C, D, X, Y, Z, причём буквы X, Y и Z встречаются только на двух первых позициях, а буквы A, B, C, D — только на двух последних. Сколько различных кодовых слов может использовать Олег?')],
  solution:[
    SUB(TH),
    P('Составляем четырехбуквенные слова. На первые два места можно поставить одну из трех букв X, Y или Z. Это можно сделать 3 · 3 = 9 вариантами. На два последних места берем букву из четырех букв A, B, C или D. Получаем 4 · 4 = 16 вариантов.'),
    P('Таким образом, всего 9 · 16 = 144 варианта.'),
    SUB(PR),
    P('Приведём другое решение на языке Python.'),
    PY('reshenie.py',
`import itertools

alphabet = "ABCDXYZ"
s = 'XYZ'
s1 = 'ABCD'
ar = itertools.product(alphabet, repeat=4)  # Размещение с повторением

arl = []
for i in ar:
    arl.append(list(i))

count = 0
for e in arl:
    if e[0] in s and e[1] in s and e[2] in s1 and e[3] in s1:
        count += 1
print(count)`),
    P('Приведём другое решение на языке Python.'),
    PY('reshenie_2.py',
`a12 = ['x', 'y', 'z']
a34 = ['a', 'b', 'c', 'd']

k = 0
for b1 in a12:
    for b2 in a12:
        for b3 in a34:
            for b4 in a34:
                s = b1 + b2 + b3 + b4
                k += 1
print(k)`),
    P('Приведём решение Ильи Крылова на языке Python.'),
    PY('reshenie_3.py',
`from itertools import product

counter1 = 0
counter2 = 0
for i in product("ABCD", repeat=2):
    counter1 += 1
for i in product("XYZ", repeat=2):
    counter2 += 1

print(counter1 * counter2)`),
    P('Приведём решение Сергея Донец на языке PascalABC.NET.'),
    PAS(

/* ================= карточка задания ================= */
function createTaskElement(task, num, mode){
  const el = document.createElement('article');
  el.className = 'task';

  const header = document.createElement('div');
  header.className = 'task-header';
  const badge = document.createElement('span');
  badge.className = 'task-num';
  badge.textContent = 'Задание ' + num + ' №' + task.num;
  header.appendChild(badge);
  el.appendChild(header);

  const cond = document.createElement('div');
  renderBlocks(cond, task.condition);
  cond.querySelectorAll('p').forEach(p => p.classList.add('task-text'));
  el.appendChild(cond);

  const ig = document.createElement('div');
  ig.className = 'input-group';
  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'in-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ (число или слово заглавными буквами):';
  ig.appendChild(label);
  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'in-' + mode + '-' + task.id;
  input.type = 'text';
  input.setAttribute('autocomplete','off');
  input.setAttribute('autocorrect','off');
  input.setAttribute('spellcheck','false');
  input.setAttribute('data-lpignore','true');
  input.placeholder = 'Например: КЛМН или 12345';
  input.addEventListener('input', e => {
    e.target.value = normalizeAnswer(e.target.value);
    if(mode === 'practice1'){
      state.a1[task.id] = e.target.value;
      input.classList.remove('correct','wrong');
      el.querySelector('.feedback').classList.remove('show');
      el.querySelector('.solution').classList.remove('show');
      el.querySelector('[data-sol]').textContent = 'Показать решение';
    } else {
      state.a2[task.id] = e.target.value;
      updateCounter();
    }
  });
  if(mode === 'practice1'){
    input.addEventListener('keydown', e => { if(e.key === 'Enter') checkTask1(task.id); });
  }
  ig.appendChild(input);
  el.appendChild(ig);

  const row = document.createElement('div');
  row.className = 'btn-row';
  if(mode === 'practice1'){
    const check = document.createElement('button');
    check.className = 'btn btn-primary';
    check.textContent = 'Проверить';
    check.addEventListener('click', () => checkTask1(task.id));
    row.appendChild(check);
    const sol = document.createElement('button');
    sol.className = 'btn btn-secondary';
    sol.setAttribute('data-sol','1');
    sol.textContent = 'Показать решение';
    sol.addEventListener('click', () => toggleSolution1(task.id));
    row.appendChild(sol);
  }
  el.appendChild(row);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'fb-' + task.id;
  el.appendChild(fb);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'sol-' + task.id;
  const st = document.createElement('div');
  st.className = 'solution-title';
  st.textContent = 'Решение:';
  solution.appendChild(st);
  const body = document.createElement('div');
  renderBlocks(body, task.solution);
  solution.appendChild(body);
  const ans = document.createElement('p');
  ans.style.cssText = 'margin-top:10px;font-weight:600;color:var(--text)';
  ans.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(ans);
  solution.appendChild(makeOriginalLink(task.num));
  el.appendChild(solution);

  return el;
}

function updateCounter(){
  const chip = $('#p2-counter');
  if(!chip) return;
  const filled = TASKS.slice(10,20).filter(t => (state.a2[t.id] || '').trim()).length;
  chip.textContent = 'Заполнено: ' + filled + ' / 10';
}

function renderPractice(mode){
  const app = $('#app');
  app.innerHTML = '';
  const list = mode === 'practice1' ? TASKS.slice(0,10) : TASKS.slice(10,20);

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = '<div><h2 class="section-title">' + (mode === 'practice1' ? '⚡ Практика 1' : '📝 Практика 2') +
    '</h2><p class="section-desc">' + (mode === 'practice1'
      ? '10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.'
      : '10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.') + '</p></div>' +
    (mode === 'practice2' ? '<span class="counter-chip" id="p2-counter">Заполнено: 0 / 10</span>' : '');
  app.appendChild(head);

  list.forEach((t,i) => app.appendChild(createTaskElement(t, i + 1, mode)));

  if(mode === 'practice2'){
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary btn-block';
    btn.style.marginTop = '8px';
    btn.textContent = '✓ Проверить все ответы';
    btn.addEventListener('click', checkAllPractice2);
    app.appendChild(btn);
    const panel = document.createElement('div');
    panel.className = 'results-panel';
    panel.id = 'results-panel-2';
    app.appendChild(panel);
    updateCounter();
  }
}

function checkTask1(id){
  const task = TASKS.find(t => t.id === id);
  if(!task) return;
  const input = $('#in-practice1-' + id), fb = $('#fb-' + id);
  if(!input || !fb) return;
  const v = normalizeAnswer(state.a1[id]);
  if(!v){
    fb.className = 'feedback show error';
    fb.textContent = 'Введите ответ перед проверкой.';
    input.classList.add('wrong');
    return;
  }
  if(v === normalizeAnswer(task.answer)){
    fb.className = 'feedback show success';
    fb.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    fb.className = 'feedback show error';
    fb.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(id){
  state.s1[id] = !state.s1[id];
  const sol = $('#sol-' + id);
  const btn = document.querySelector('#in-practice1-' + id).closest('.task').querySelector('[data-sol]');
  if(sol) sol.classList.toggle('show', state.s1[id]);
  if(btn) btn.textContent = state.s1[id] ? 'Скрыть решение' : 'Показать решение';
}

function checkAllPractice2(){
  const list = TASKS.slice(10,20);
  let ok = 0;
  const res = list.map((t,i) => {
    const v = normalizeAnswer(state.a2[t.id]);
    const good = v === normalizeAnswer(t.answer);
    if(good) ok++;
    return {i:i+1, t, v: v || '—', good};
  });
  const panel = $('#results-panel-2');
  if(!panel) return;
  panel.innerHTML = '';
  panel.classList.add('show');

  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = '<div class="results-score-num">' + ok + ' / 10</div><div class="results-score-label">правильных ответов</div>';
  panel.appendChild(score);

  const bar = document.createElement('div');
  bar.className = 'progress-bar';
  bar.innerHTML = '<div class="progress-fill" style="width:' + (ok * 10) + '%"></div>';
  panel.appendChild(bar);

  res.forEach(x => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (x.good ? 'correct' : 'wrong');
    item.innerHTML = '<div class="result-item-head"><span class="result-item-num">Задание ' + x.i + ' №' + x.t.num +
      '</span><span class="result-item-status ' + (x.good ? 'correct' : 'wrong') + '">' + (x.good ? 'Верно' : 'Неверно') + '</span></div>' +
      '<div class="result-item-answers"><strong>Ваш ответ:</strong> ' + esc(x.v) + ' · <strong>Правильный:</strong> ' + esc(x.t.answer) + '</div>';
    if(!x.good){
      const sol = document.createElement('div');
      sol.className = 'result-item-solution';
      renderBlocks(sol, x.t.solution);
      const a = document.createElement('p');
      a.style.cssText = 'margin-top:8px;font-weight:600;color:var(--text)';
      a.textContent = 'Ответ: ' + x.t.answer;
      sol.appendChild(a);
      sol.appendChild(makeOriginalLink(x.t.num));
      item.appendChild(sol);
    }
    panel.appendChild(item);
  });
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}

function switchTab(name){
  state.tab = name;
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  if(name === 'theory') renderTheory(); else renderPractice(name);
  window.scrollTo({top:0, behavior:'smooth'});
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
renderTheory();
